service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Giữ ngưỡng 3000ms vì baseline đo được P95 160ms, P99 160ms (41/41 request
    đạt), nên còn nhiều headroom cho incident rag_slow mà vẫn phản ánh trải nghiệm
    người dùng (chờ > 3s là chậm). Target 99.5% trên cửa sổ 28 ngày cho error
    budget 0.5% = 5 request xấu trên mỗi 1000 request, tương đương khoảng
    3.4 giờ nếu toàn bộ traffic xấu liên tục (0.005 x 28 x 24h).
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
